<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكي CSTR</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6b7280; --card:#f3f4f6; --a:#2563eb; --b:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111418; --fg:#e5e7eb; --muted:#9ca3af; --card:#1c2128; --a:#60a5fa; --b:#f87171; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --bg:#111418; --fg:#e5e7eb; --muted:#9ca3af; --card:#1c2128; --a:#60a5fa; --b:#f87171; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  .app { max-width:1100px; margin-inline:auto; padding-block:16px;
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .grid > * { min-width:0; }
  h1 { font-size:1.3rem; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:300px 1fr; gap:16px; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:10px; padding:12px; }
  label { display:flex; justify-content:space-between; font-size:.9rem; margin-top:8px; }
  label output { color:var(--muted); direction:ltr; }
  input[type=range] { width:100%; }
  canvas { width:100%; height:220px; display:block; background:var(--bg); border-radius:6px; margin-bottom:10px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  button { flex:1; padding:8px; border:0; border-radius:6px; background:var(--a); color:#fff; font:inherit; cursor:pointer; }
  .stats { display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); direction:ltr; font-size:.9rem; margin:0 0 8px; }
</style>
</head>
<body>
<main class="app" dir="rtl" lang="ar">
<h1>محاكي مفاعل CSTR (تفاعل طارد للحرارة A → B)</h1>
<div class="grid">
  <div class="card" id="controls"></div>
  <div>
    <p class="stats" id="stats"></p>
    <canvas id="ts" width="800" height="440"></canvas>
    <canvas id="ph" width="800" height="440"></canvas>
  </div>
</div>
</main>
<script>
// ---- Model (mirrors cstr/model.py) ----
const P = { q:100, V:100, CAf:1, Tf:350, Tc:300, k0:7.2e10, E_R:8750, dH:-5e4, rho:1000, Cp:0.239, UA:5e4 };
function f(x) {
  const [CA, T] = x, k = P.k0 * Math.exp(-P.E_R / T);
  return [P.q/P.V*(P.CAf-CA) - k*CA,
          P.q/P.V*(P.Tf-T) + (-P.dH)/(P.rho*P.Cp)*k*CA + P.UA/(P.rho*P.Cp*P.V)*(P.Tc-T)];
}
function rk4(x, h) {
  const add = (a, b, s) => a.map((v, i) => v + s*b[i]);
  const k1 = f(x), k2 = f(add(x,k1,h/2)), k3 = f(add(x,k2,h/2)), k4 = f(add(x,k3,h));
  return x.map((v, i) => v + h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));
}

// ---- Controls ----
const defs = [
  ['q','معدل التدفق q [L/min]',20,300,1],
  ['Tf','درجة حرارة التغذية Tf [K]',300,400,0.5],
  ['Tc','درجة حرارة المبرّد Tc [K]',270,350,0.5],
  ['CAf','تركيز التغذية CAf [mol/L]',0.2,2,0.01],
  ['UA','انتقال الحرارة UA [J/min·K]',0,2e5,1000],
];
const ctl = document.getElementById('controls');
const sliders = {};
for (const [key, name, min, max, step] of defs) {
  const l = document.createElement('label');
  l.innerHTML = `<span>${name}</span><output id="o_${key}"></output>`;
  const r = Object.assign(document.createElement('input'), { type:'range', min, max, step, value:P[key] });
  const show = () => document.getElementById('o_'+key).textContent = (+r.value).toPrecision(4).replace(/\.?0+$/,'');
  r.oninput = () => { P[key] = +r.value; show(); };
  sliders[key] = { r, show };
  ctl.append(l, r); show();
}
const row = document.createElement('div'); row.className = 'row';
row.innerHTML = '<button id="reset">إعادة</button><button id="pause">إيقاف</button>';
ctl.append(row);

// ---- PID (mirrors cstr/control.py): manipulates Tc to hold T at the setpoint ----
const pid = { on:false, Tsp:362.45, Kc:2, tauI:5, bias:310, I:0 };
const pidBox = document.createElement('div'); pidBox.style.marginTop = '12px';
pidBox.innerHTML = '<label style="justify-content:flex-start;gap:8px"><input type="checkbox" id="pid_on"><span>متحكم PID (يتحكم في Tc)</span></label>';
ctl.append(pidBox);
document.getElementById('pid_on').onchange = () => {
  pid.on = document.getElementById('pid_on').checked; pid.I = 0; pid.bias = P.Tc; sliders.Tc.r.disabled = pid.on;
};
const pidDefs = [['Tsp','نقطة الضبط Tsp [K]',280,420,0.05],['Kc','الكسب Kc',0,20,0.1],['tauI','زمن التكامل τi [min]',0.5,20,0.1]];
for (const [key, name, min, max, step] of pidDefs) {
  const l = document.createElement('label'); l.innerHTML = `<span>${name}</span><output id="o_${key}"></output>`;
  const r = Object.assign(document.createElement('input'), { type:'range', min, max, step, value:pid[key] });
  const show = () => document.getElementById('o_'+key).textContent = (+r.value).toString();
  r.oninput = () => { pid[key] = +r.value; show(); };
  sliders[key] = { r, show }; pidBox.append(l, r); show();
}
function pidStep(T, dt) {
  const e = pid.Tsp - T, u = pid.bias + pid.Kc*(e + pid.I/pid.tauI);
  const us = Math.min(350, Math.max(270, u));
  if (u === us || (u > us) === (e < 0)) pid.I += e*dt;     // anti-windup
  return us;
}

// Presets found with cstr.model.steady_states / is_stable.
const presets = [
  ['PID يثبّت الحالة غير المستقرة (يخمد التذبذب)', { q:75, Tf:350, Tc:310 }, { on:true, Tsp:362.45, Kc:2, tauI:5 }],
  ['افتراضي (حالة مستقرة واحدة)', { q:100, Tf:350, Tc:300 }],
  ['حالتان مستقرتان (انقر على الرسم السفلي لتغيير البداية)', { q:150, Tf:340, Tc:290 }],
  ['تذبذب مستمر', { q:75, Tf:350, Tc:310 }],
];
const pr = document.createElement('div'); pr.style.marginTop = '12px';
pr.innerHTML = '<div style="color:var(--muted);font-size:.9rem">إعدادات جاهزة</div>';
for (const [name, vals, pidVals] of presets) {
  const b = document.createElement('button');
  b.textContent = name; b.style.cssText = 'display:block;width:100%;margin-top:6px;text-align:start';
  b.onclick = () => { for (const k in vals) { sliders[k].r.value = vals[k]; P[k] = vals[k]; sliders[k].show(); }
    const c = pidVals || { on:false };
    for (const k in c) if (k !== 'on') { pid[k] = c[k]; sliders[k].r.value = c[k]; sliders[k].show(); }
    const box = document.getElementById('pid_on'); box.checked = c.on; box.onchange();
    reset(); };
  pr.append(b);
}
ctl.append(pr);

// ---- Simulation loop ----
const TMAX = 20, DT = 0.005, SPEED = 2;      // min of process time per real second
let x, t, hist, paused = false;
let axes = null;                                  // phase-plane axis ranges for click-to-start
function reset(x0 = [0.5, 350]) { pid.I = 0; x = x0.slice(); t = 0; hist = [{ t, CA:x[0], T:x[1] }]; }
reset();
document.getElementById('reset').onclick = () => reset();
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'متابعة' : 'إيقاف'; };

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function plot(cv, series, xr, yr, xl, yl) {
  const c = cv.getContext('2d'), W = cv.width, H = cv.height, m = { l:60, r:16, t:16, b:40 };
  c.clearRect(0, 0, W, H);
  c.font = '16px system-ui'; c.fillStyle = cssv('--muted'); c.strokeStyle = cssv('--muted'); c.lineWidth = 1;
  const X = v => m.l + (v-xr[0])/(xr[1]-xr[0])*(W-m.l-m.r);
  const Y = v => H-m.b - (v-yr[0])/(yr[1]-yr[0])*(H-m.t-m.b);
  c.strokeRect(m.l, m.t, W-m.l-m.r, H-m.t-m.b);
  for (let i = 0; i <= 4; i++) {
    const xv = xr[0]+(xr[1]-xr[0])*i/4, yv = yr[0]+(yr[1]-yr[0])*i/4;
    c.textAlign = 'center'; c.fillText(xv.toPrecision(3), X(xv), H-m.b+18);
    c.textAlign = 'right';  c.fillText(yv.toPrecision(3), m.l-6, Y(yv)+5);
  }
  c.textAlign = 'center'; c.fillText(xl, W/2, H-6);
  c.save(); c.translate(14, H/2); c.rotate(-Math.PI/2); c.fillText(yl, 0, 0); c.restore();
  for (const s of series) {
    c.strokeStyle = cssv(s.color); c.lineWidth = 2; c.beginPath();
    s.pts.forEach(([a, b], i) => i ? c.lineTo(X(a), Y(b)) : c.moveTo(X(a), Y(b)));
    c.stroke();
  }
  return { X, Y, c };
}

document.getElementById('ph').addEventListener('click', e => {
  if (!axes) return;
  const cv = e.currentTarget, r = cv.getBoundingClientRect(), m = axes.m;
  const px = (e.clientX-r.left)/r.width*cv.width, py = (e.clientY-r.top)/r.height*cv.height;
  const T0 = axes.Tmin + (px-m.l)/(cv.width-m.l-m.r)*(axes.Tmax-axes.Tmin);
  const CA0 = axes.CAmax*(cv.height-m.b-py)/(cv.height-m.t-m.b);
  if (T0 > 0 && CA0 >= 0) reset([Math.min(CA0, P.CAf), T0]);
});

let last = performance.now();
function frame(now) {
  const dtReal = Math.min((now-last)/1000, 0.1); last = now;
  if (!paused) {
    const target = t + dtReal*SPEED;
    while (t < target) {
      if (pid.on) { P.Tc = pidStep(x[1], DT); sliders.Tc.r.value = P.Tc; sliders.Tc.show(); }
      x = rk4(x, DT); t += DT;
    }
    hist.push({ t, CA:x[0], T:x[1] });
    if (hist.length > 4000) hist.shift();
  }
  const t0 = Math.max(0, t-TMAX);
  const vis = hist.filter(h => h.t >= t0);
  const Tmin = Math.min(P.Tc, ...vis.map(h => h.T))-5, Tmax = Math.max(P.Tf+60, ...vis.map(h => h.T))+5;
  // Time series: temperature (red) on the plot, conversion X in a second pass below.
  plot(document.getElementById('ts'),
       [{ color:'--b', pts: vis.map(h => [h.t, h.T]) }], [t0, t0+TMAX], [Tmin, Tmax], 'الزمن [min]', 'T [K]');
  const ph = plot(document.getElementById('ph'),
       [{ color:'--a', pts: vis.map(h => [h.T, h.CA]) }], [Tmin, Tmax], [0, Math.max(P.CAf, 0.1)*1.05], 'T [K]', 'CA [mol/L]');
  axes = { Tmin, Tmax, CAmax: Math.max(P.CAf, 0.1)*1.05, m: { l:60, r:16, t:16, b:40 } };
  ph.c.fillStyle = cssv('--b'); ph.c.beginPath(); ph.c.arc(ph.X(x[1]), ph.Y(x[0]), 5, 0, 7); ph.c.fill();
  document.getElementById('stats').textContent =
    `t=${t.toFixed(2)} min   CA=${x[0].toFixed(4)}   T=${x[1].toFixed(2)} K   X=${((1-x[0]/P.CAf)*100).toFixed(1)}%`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
